<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Форма және Фрейм — 22 тапсырма</title>
<style id="css">
:root{--bg:#f2f7fb;--card:#fff;--hd:#0b2f4a;--ink:#0b2f4a;--ink2:#14507a;--sky:#2a9dd6;--sun:#f0b92a;--line:#d3e1ec;--tx:#1a2b3b;--mu:#5d7387;--in:#fbfdff;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1822;--card:#13283a;--hd:#0a2237;--ink:#8fd0f2;--ink2:#5fb6e6;--line:#25435a;--tx:#e4eef5;--mu:#9bb3c4;--in:#0f2130}}
:root[data-theme=dark]{--bg:#0c1822;--card:#13283a;--hd:#0a2237;--ink:#8fd0f2;--ink2:#5fb6e6;--line:#25435a;--tx:#e4eef5;--mu:#9bb3c4;--in:#0f2130}
*,*:before{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.6 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg)}
.in{padding:18px}
h2,h3{font-family:Georgia,serif;color:var(--ink);margin:0 0 10px}
h2{font-size:1.5rem}.mu{color:var(--mu);margin:0 0 16px}
.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--hd);color:#fff;border-bottom:4px solid var(--sun)}
header h1{font:700 1.15rem Georgia,serif;margin:0}
#mb{display:none;padding:4px 12px;margin:0}
aside{overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:8px 10px}
aside h4{margin:14px 8px 4px;font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
aside a,.mn a{display:block;padding:7px 12px;margin-bottom:2px;border-radius:8px;cursor:pointer;color:var(--ink);font-weight:600;border-left:4px solid transparent}
aside a:hover,aside a.on,.mn a:hover,.mn a.on{background:rgba(42,157,214,.16);border-left-color:var(--sun)}
#main{overflow:auto;padding:22px}
.lay{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.lay .hd{background:var(--hd);color:#fff;padding:10px 16px;font:700 1.1rem Georgia,serif}
.bd{display:grid;grid-template-columns:200px 1fr;height:540px}
.w .bd{grid-template-columns:360px 1fr}
.mn{border-right:1px solid var(--line);padding:8px;overflow:auto}
.lay iframe{width:100%;height:100%;border:0;background:var(--bg)}
.tri{display:flex;flex-wrap:wrap;gap:14px}
.tri iframe{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;padding:10px 18px 16px}
legend{font-weight:700;color:#0b2f4a;padding:3px 14px;background:var(--sun);border-radius:20px;font-size:.85rem}
label{display:block;margin-top:10px;font-weight:600;font-size:.9rem;color:var(--ink)}
.oi{display:inline-block;margin:4px 14px 0 0;font-weight:400;color:var(--tx)}
.in2{margin-top:10px}
input:not([type=radio]):not([type=checkbox]):not([type=color]),select,textarea{width:100%;padding:9px 12px;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;font:inherit;color:var(--tx);background:var(--in)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(42,157,214,.18)}
input:user-invalid{border-color:#d9534f}
button{padding:10px 22px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;background:var(--sun);color:#0b2f4a;margin:8px 8px 0 0}
button:hover{filter:brightness(1.06)}
button[type=reset]{background:transparent;border:1px solid var(--ink2);color:var(--ink)}
table{width:100%;border-collapse:collapse;background:var(--card);margin-bottom:12px}
th,td{padding:9px 12px;border:1px solid var(--line);text-align:left}
th{background:var(--hd);color:#fff}
pre{background:var(--hd);color:#e8f3fa;padding:12px;border-radius:10px;overflow:auto}
.vid{aspect-ratio:16/9;background:#0b2f4a;color:#fff;display:grid;place-items:center;font-size:3rem;border-radius:12px}
.ok{color:#1a8a4a;font-weight:700}
a{color:var(--ink2);cursor:pointer}
@media(max-width:800px){.app{grid-template-columns:1fr}#mb{display:block}aside{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;z-index:5}aside.open{display:block}#main{padding:14px}.bd,.w .bd{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:680px}.mn{display:flex;gap:4px;border-right:0;border-bottom:1px solid var(--line)}.mn a{white-space:nowrap}.w .mn{display:block;max-height:300px}}
</style></head>
<body>
<div class="app">
<header><button id="mb" aria-label="Мәзір">☰</button><h1>🎓 Форма және Фрейм · 22 тапсырма</h1></header>
<aside id="sd"></aside>
<section id="main"></section>
</div>

function fld(f){var l=f[0],t=f[1]||'text',x=f[2]||'',m=f[3],n='f'+(++U);
 if(t=='radio'||t=='check'){var ty=t=='radio'?'radio':'checkbox';return '<div class="in2"><b>'+l+'</b><br>'+x.split(';').map(function(o,j){return '<label class="oi"><input type="'+ty+'" name="'+l+'" value="'+o+'"'+(t=='radio'&&!j?' required':'')+'> '+o+'</label>'}).join('')+'</div>'}
 var a='id="'+n+'" name="'+l+'"',c;
 if(t=='select')c='<select '+a+' required><option value="">— таңдаңыз —</option>'+x.split(';').map(function(o){return '<option>'+o+'</option>'}).join('')+'</select>';
 else if(t=='textarea')c='<textarea '+a+' rows="3" maxlength="'+(m||300)+'" placeholder="'+x+'"></textarea>';
 else if(t=='range'){var r=x.split(';');c='<input '+a+' type="range" min="'+r[0]+'" max="'+r[1]+'" value="'+r[1]+'">'}
 else if(t=='number'){var q=(x||'0;100').split(';');c='<input '+a+' type="number" min="'+q[0]+'" max="'+q[1]+'" placeholder="'+q[0]+'–'+q[1]+'" required>'}
 else if(t=='file'||t=='color'||t=='date'||t=='time')c='<input '+a+' type="'+t+'"'+(t=='file'||t=='color'?'':' required')+'>';
 else c='<input '+a+' type="'+t+'" placeholder="'+x+'" maxlength="'+(m||60)+'" required>';
 return '<label for="'+n+'">'+l+c+'</label>'}

 I.push(left?function(){g('f'+id).srcdoc=sd('<p>Нәтиже осы iframe ішінде шығады.</p>')}:function(){S(id,pairs[0][0])});

["Жұмысқа қабылдау формасы","file, number, range, textarea.",function(){return form([["Жеке ақпарат",nm,em,ct],["Білімі мен тәжірибесі",["Білім деңгейі","select","Орта;Бакалавр;Магистр"],["Тәжірибе (жыл)","number","0;40"]],["Дағдылар",["Python деңгейі","range","1;10"],["JavaScript деңгейі","range","1;10"],["Күтілетін жалақы (₸)","number","0;5000000"]],["Құжаттар",["CV жүктеу","file"],["Өзі туралы","textarea","Қысқаша жазыңыз"]]],"Өтініш жіберу")}],
